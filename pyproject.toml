[project]
name = "openrouter"
version = "0.1.0"
description = """\
  Use any OpenRouter model in ComfyUI with your own key: chat, images, video, speech, transcription, embeddings, \
  reranking and decisions.\
  """
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "import-linter==2.15",
]

[tool.deptry]
exclude = [".artifacts", ".git", ".venv", "node_modules", "web"]
# ComfyUI supplies these modules in its application environment.
per_rule_ignores.DEP001 = [
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
    "torch",
]
# ComfyUI supplies aiohttp; the dev group installs it only for the type checker.
per_rule_ignores.DEP004 = ["aiohttp"]
known_first_party = ["scripts", "src"]

[tool.comfy]
DisplayName = "OpenRouter"
requires-comfyui = ">=0.34.6"

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the host packages import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
# The node classes and the comfy package are the host boundary: ComfyUI calls them and they speak its types.
source_modules = [
    "src.config",
    "src.openrouter",
    "src.settings",
    "src.storage",
    "src.state",
]
forbidden_modules = [
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
]
