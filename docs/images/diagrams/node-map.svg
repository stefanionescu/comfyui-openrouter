<svg xmlns="http://www.w3.org/2000/svg" width="992" height="670" viewBox="0 0 992 670" role="img" aria-label="Node map: one card for each kind of node. Chat: Attach Document feeds Chat: Ask, and Decision: Add Question feeds Decision: Ask, which feeds Decision: Read Answer. Video: Download collects a job Video: Generate left running. Request Options feeds any paid node, and Model: Info shows what a model takes. An indigo square marks a node that sends a paid request, and a hollow square one that bills nothing.">
<title>Node map: one card for each kind of node. Chat: Attach Document feeds Chat: Ask, and Decision: Add Question feeds Decision: Ask, which feeds Decision: Read Answer. Video: Download collects a job Video: Generate left running. Request Options feeds any paid node, and Model: Info shows what a model takes. An indigo square marks a node that sends a paid request, and a hollow square one that bills nothing.</title>
