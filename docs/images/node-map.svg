="normal" fill="#C2BFB9" text-anchor="start">Embeddings, similarity</text><rect x="412" y="376" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="376" width="230" height="5" rx="2" fill="#6366F1"/><text x="426" y="403" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Search: Rank</text><text x="426" y="422" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Best matches first</text><text x="32" y="478" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Decision</text><rect x="150" y="444" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="444" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="471" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Decision: Add Question</text><text x="164" y="490" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Yes or no, choice, score</text><rect x="412" y="444" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="444" width="230" height="5" rx="2" fill="#6366F1"/><text x="426" y="471" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Decision: Ask</text><text x="426" y="490" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Answers, probabilities</text><line x1="380" y1="473" x2="403" y2="473" stroke="#F0FF41" stroke-width="2"/><path d="M412 473 l-10 -6 v12 z" fill="#F0FF41"/><rect x="674" y="444" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="674" y="444" width="230" height="5" rx="2" fill="#5C5362"/><text x="688" y="471" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Decision: Read Answer</text><text x="688" y="490" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Text, yes flag, numbers</text><line x1="642" y1="473" x2="665" y2="473" stroke="#F0FF41" stroke-width="2"/><path d="M674 473 l-10 -6 v12 z" fill="#F0FF41"/><text x="32" y="546" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Options</text><rect x="150" y="512" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="512" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="539" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Request Options</text><text x="164" y="558" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Providers, prices, fields</text><line x1="380" y1="541" x2="403" y2="541" stroke="#F0FF41" stroke-width="2"/><path d="M412 541 l-10 -6 v12 z" fill="#F0FF41"/><text x="424" y="546" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#F0FF41" text-anchor="start">any paid node</text></svg>
