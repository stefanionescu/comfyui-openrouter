extends: conditional
message: Spell out '%s' on first use.
level: error
ignorecase: false
first: \b([A-Z]{3,6})\b
second: (?:\b[A-Za-z]+(?:-[A-Za-z]+)* ){2,5}\(([A-Z]{3,6})\)
exceptions:
