# Adapted from Microsoft.Ordinal; see ../LICENSES.md.
extends: existence
message: 'Do not add -ly to an ordinal number.'
link: https://learn.microsoft.com/en-us/style-guide/numbers
level: error
ignorecase: true
action:
    name: edit
    params:
        - trim
        - ly
tokens:
    - firstly
    - secondly
    - thirdly
