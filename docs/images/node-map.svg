<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-label="Node map. Chat: Attach Document feeds Chat: Ask. Decision: Add Question feeds Decision: Ask, which feeds Decision: Read Answer. Request Options feeds any paid node. Video: Download collects a job Video: Generate left running, so no link joins them. Paid nodes have an indigo bar."><title>Node map. Chat: Attach Document feeds Chat: Ask. Decision: Add Question feeds Decision: Ask, which feeds Decision: Read Answer. Request Options feeds any paid node. Video: Download collects a job Video: Generate left running, so no link joins them. Paid nodes have an indigo bar.</title><rect width="1000" height="600" rx="14" fill="#211927"/><text x="32" y="44" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="start">How the nodes connect</text><text x="32" y="68" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="13" font-weight="normal" fill="#C2BFB9" text-anchor="start">Arrows show a node's output feeding the next node. Paid nodes have an indigo bar.</text><text x="32" y="138" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Chat</text><rect x="150" y="104" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="104" width="230" height="5" rx="2" fill="#5C5362"/><text x="164" y="131" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Chat: Attach Document</text><text x="164" y="150" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">A PDF or text file</text><rect x="412" y="104" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="104" width="230" height="5" rx="2" fill="#6366F1"/><text x="426" y="131" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Chat: Ask</text><text x="426" y="150" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Text, images, speech</text><line x1="380" y1="133" x2="403" y2="133" stroke="#F0FF41" stroke-width="2"/><path d="M412 133 l-10 -6 v12 z" fill="#F0FF41"/><text x="32" y="206" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Image</text><rect x="150" y="172" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="172" width="230" height="5" rx="2" fill="#6366F1"/><text x="164" y="199" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Image: Generate</text><text x="164" y="218" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">Images, masks, SVG</text><text x="32" y="274" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="14" font-weight="bold" fill="#C2BFB9" text-anchor="start">Video</text><rect x="150" y="240" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="150" y="240" width="230" height="5" rx="2" fill="#6366F1"/><text x="164" y="267" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="start">Video: Generate</text><text x="164" y="286" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="11.5" font-weight="normal" fill="#C2BFB9" text-anchor="start">From a prompt or frames</text><rect x="412" y="240" width="230" height="58" rx="8" fill="#312C34" stroke="#413B45"/><rect x="412" y="240" width="230" height="5" rx="2" fill="#5C5362"/><text x="426" y="267" font-family="Verdana, 'DejaVu Sans', Arial, sans-serif" font-size="15" 