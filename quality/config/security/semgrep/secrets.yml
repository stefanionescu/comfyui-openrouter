rules:
    - id: openrouter-secrets-hf-token-literal
      message: Do not commit HuggingFace token literals.
      severity: ERROR
      languages:
          - generic
      pattern-regex: 'hf_[A-Za-z0-9]{20,}'
    - id: openrouter-api-key-literal
      message: Keep OpenRouter keys out of the repository. Use OPENROUTER_API_KEY or OpenRouter settings.
      severity: ERROR
      languages:
          - generic
      pattern-regex: 'sk-or-v1-[0-9a-f]{64}'
