[project]
name = "comfyui-openrouter"
version = "0.1.0"
description = """\
  Use any OpenRouter model in ComfyUI with your own key: chat, images, video, speech, transcription, embeddings, \
  reranking and decisions.\
  """
readme = "README.md"
license = "MIT"
license-files = [ "LICENSE.md" ]
authors = [ { name = "Stefan Ionescu" } ]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
  "aiohttp>=3.12,<4",
  "av>=17,<19",
  "bandit[toml]",
  "basedpyright>=1.31,<2",
  "deptry",
  "import-linter",
  "interrogate",
  "numpy>=2,<3",
  "packaging>=25,<27",
  "pillow>=11,<13",
  "pip-audit>=2.10.1,<3",
  "pydoclint",
  "pyproject-fmt",
  "pyyaml==6.0.3",
  "ruff>=0.12,<1",
  "tomli",
  "types-pyyaml==6.0.12.20260906",
  "validate-pyproject",
  "vulture",
]

[tool.ruff]
target-version = "py312"
line-length = 120
src = [ "." ]
exclude = [
  ".artifacts",
  ".cache",
  ".git",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "node_modules",
  "web",
]
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
format.docstring-code-format = true
lint.select = [
  "A",
  "ANN",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "D",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FIX",
  "FLY",
  "FURB",
  "G",
  "ICN",
  "INP",
  "ISC",
  "LOG",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TD",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "COM812",
  "D203",
  "D213",
]
lint.mccabe.max-complexity = 8
# ComfyUI loads the repository as a package even when its folder name has hyphens.
lint.pep8-naming.extend-ignore-names = [ "comfyui-openrouter" ]
lint.pylint.max-args = 5
lint.pylint.max-bool-expr = 4
lint.pylint.max-branches = 8
lint.pylint.max-locals = 10
lint.pylint.max-public-methods = 12
lint.pylint.max-returns = 4
lint.pylint.max-statements = 30

[tool.interrogate]
fail-under = 100
ignore-init-method = true
exclude = [ ".artifacts", ".git", ".venv", "node_modules", "web" ]
verbose = 1

[tool.deptry]
exclude = [ ".artifacts", ".git", ".venv", "node_modules", "web" ]
# ComfyUI supplies these modules in its application environment.
per_rule_ignores.DEP001 = [
  "comfy",
  "comfy_api",
  "comfy_api_nodes",
  "comfy_execution",
  "comfy_extras",
  "folder_paths",
  "node_helpers",
  "nodes",
  "server",
  "torch"
]
# ComfyUI supplies these libraries; the dev group installs them only for checks and scripts.
per_rule_ignores.DEP004 = [ "aiohttp", "av", "numpy", "PIL", "tomli", "packaging", "yaml" ]
known_first_party = [ "quality", "scripts", "src" ]

[tool.vulture]
paths = [ "__init__.py", "quality", "scripts", "src" ]
exclude = [ ".artifacts", ".git", ".venv", "node_modules", "web" ]
min_confidence = 80
sort_by_size = true

[tool.bandit]
exclude_dirs = [ ".artifacts", ".git", ".venv", "node_modules", "web" ]

[tool.comfy]
DisplayName = "OpenRouter"
requires-comfyui = ">=0.34.6"

[tool.importlinter]
root_packages = [ "src", "scripts", "quality" ]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Scripts must not import the quality tooling"
type = "forbidden"
source_modules = [ "scripts" ]
forbidden_modules = [ "quality" ]

[[tool.importlinter.contracts]]
name = "Runtime must not import scripts or quality tooling"
type = "forbidden"
source_modules = [ "src" ]
forbidden_modules = [ "scripts", "quality" ]

[[tool.importlinter.contracts]]
# Nothing here may import a package above it, which is what keeps the packages free of cycles.
name = "The packages stack in one order"
type = "layers"
layers = [
  "src.extension",
  "src.nodes",
  "src.comfy",
  "src.runtime",
  "src.execution | src.discovery | src.settings",
  "src.http",
  "src.credentials",
  "src.storage | src.serialization | src.tasks | src.paths",
  "src.errors",
  "src.state",
  "src.config",
]

[[tool.importlinter.contracts]]
name = "Only the host packages import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
# The node classes and the comfy package are the host boundary: ComfyUI calls them and they speak its types.
source_modules = [
  "src.credentials",
  "src.config",
  "src.discovery",
  "src.errors",
  "src.execution",
  "src.http",
  "src.paths",
  "src.runtime",
  "src.serialization",
  "src.settings",
  "src.state",
  "src.storage",
  "src.tasks",
]
forbidden_modules = [
  "comfy",
  "comfy_api",
  "comfy_api_nodes",
  "comfy_execution",
  "comfy_extras",
  "folder_paths",
  "node_helpers",
  "nodes",
  "server",
]

[[tool.importlinter.contracts]]
name = "Records must not import operations"
type = "forbidden"
source_modules = [ "src.state" ]
forbidden_modules = [
  "src.comfy",
  "src.discovery",
  "src.execution",
  "src.http",
  "src.nodes",
  "src.settings",
]

[[tool.importlinter.contracts]]
name = "Config must not import runtime code or tooling"
type = "forbidden"
source_modules = [ "src.config" ]
forbidden_modules = [ "src.nodes", "src.comfy", "src.execution", "src.discovery", "src.state", "scripts", "quality" ]
