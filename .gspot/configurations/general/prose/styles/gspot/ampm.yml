# Adapted from Microsoft.AMPM; see ../LICENSES.md.
extends: existence
message: Use 'AM' or 'PM' (preceded by a space).
link: https://learn.microsoft.com/en-us/style-guide/a-z-word-list-term-collections/term-collections/date-time-terms
level: error
nonword: true
tokens:
    - '\d{1,2}[AP]M\b'
    - '\d{1,2} ?[ap]m\b'
    - '\d{1,2} ?[aApP]\.[mM]\.'
