# Adapted from RedHat.HeadingPunctuation; see ../LICENSES.md.
extends: existence
level: warning
link: https://redhat-documentation.github.io/vale-at-red-hat/reference-guide.html#heading-punctuation
message: Do not use end punctuation in headings.
nonword: true
scope: heading
action:
    name: remove
tokens:
    - (?<![a-z0-9])\.$|\?$|(?<!\w)!$
