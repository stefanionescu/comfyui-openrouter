# Generated by gspot from gspot.toml. Do not edit this file.
# To change it, edit gspot.toml, then run: gspot apply
name: gspot

on:
  push:
    branches:
      - "**"
  pull_request: {}
  merge_group: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore caches
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: gspot-${{ runner.os }}-${{ runner.arch }}-0.3.7-${{ hashFiles('.gspot/package.json', '.gspot/*lock*', '.gspot/pyproject.toml', '.gspot/mise.toml', 'bun.lock', 'uv.lock') }}
          path: |
            ~/.npm/_cacache
            ~/.bun/install/cache
            ~/.cache/uv
            ~/.cache/mise
            ~/.local/share/mise/installs
            ~/.local/share/pnpm/store
            ~/.yarn/berry/cache
          restore-keys: gspot-${{ runner.os }}-${{ runner.arch }}-

      - name: Set up mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.7
          cache: false

      - name: Install project dependencies
        run: |-
          bun install --frozen-lockfile
          mise exec uv@0.12.22 -- uv sync --locked

      - name: Install gspot tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise exec node@24 npm:@gspothq/cli@0.3.7 bun@1.4.3 -- gspot install

      - name: Save caches
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.cache.outputs.cache-primary-key }}
          path: |
            ~/.npm/_cacache
            ~/.bun/install/cache
            ~/.cache/uv
            ~/.cache/mise
            ~/.local/share/mise/installs
            ~/.local/share/pnpm/store
            ~/.yarn/berry/cache

      - name: Lint
        env:
          GSPOT_CI_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event.before }}
        run: |
          mise exec node@24 npm:@gspothq/cli@0.3.7 bun@1.4.3 -- gspot check --changed "${GSPOT_CI_BASE}"

      - name: Slow checks
        if: github.event_name == 'push'
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          (cd .gspot && mise install lychee)
          mise exec node@24 npm:@gspothq/cli@0.3.7 bun@1.4.3 -- gspot check --only 'docs/lychee-external,security/semgrep-registry'
