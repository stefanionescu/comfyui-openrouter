[tools]
python = "3.12.13"
uv = "0.11.21"
node = "24.20.0"
bun = "1.4.3"
"pipx:comfy-cli" = "1.20.0"

# gspot checks a pushed commit in a scratch copy without a .venv. The type checker then reads the active environment,
# and uv run reads UV_PROJECT_ENVIRONMENT, so both use this repository's .venv and the ComfyUI install on its path.
[env]
_.python.venv = { path = ".venv" }
UV_PROJECT_ENVIRONMENT = "{{config_root}}/.venv"

[settings]
not_found_auto_install = false

[settings.task]
run_auto_install = false
